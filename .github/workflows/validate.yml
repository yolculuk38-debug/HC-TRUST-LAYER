name: HC-TRUST-LAYER Validation
# Security hardening defaults: least-privilege token scopes, deterministic concurrency, and bounded runtime.

on:
  push:
    branches:
      - main
    paths:
      - 'records/**'
      - 'schema/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'records/**'
      - 'schema/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'

permissions:
  contents: read


concurrency:
  # Cancel superseded runs on the same ref to prevent duplicate executions and non-deterministic outcomes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Bound workflow runtime to reduce abuse/DoS risk from stalled jobs.
    timeout-minutes: 20
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate records against shared schema contract
        run: PYTHONPATH=src python -m hc_trust.cli validate-records records

      - name: Test shared CI validation negative paths
        run: PYTHONPATH=src python -m pytest -q tests/test_validate_records_cli.py

      - name: Verify content hashes
        run: python src/verify_hashes.py records

      - name: Generate audit snapshot
        run: python src/generate_audit_snapshot.py


      - name: Generate explorer index
        run: python src/generate_explorer_index.py

      - name: Upload explorer index artifact
        uses: actions/upload-artifact@v7
        with:
          name: explorer-index
          path: generated/explorer_index.json

      - name: Upload audit snapshot artifact
        uses: actions/upload-artifact@v7
        with:
          name: audit-snapshot
          path: generated/audit_snapshot.json

  runtime-api-tests:
    # Bound workflow runtime to reduce abuse/DoS risk from stalled jobs.
    timeout-minutes: 20
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install runtime/API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run runtime/API pytest suite
        run: >-
          PYTHONPATH=src pytest -q
          tests/test_hc_runtime_app.py
          tests/test_hc_runtime_pipeline.py
          tests/test_hc_runtime_response_contracts.py
          tests/test_refactor_contracts.py
          tests/runtime

      - name: Run explicit runtime/API contract subset
        run: PYTHONPATH=src pytest -q tests/runtime tests/test_hc_runtime_response_contracts.py
